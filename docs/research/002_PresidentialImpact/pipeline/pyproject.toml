[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presidential-impact-data"
version = "0.1.0"
description = "Portable, provenance-first data pipeline for Presidential Impact research"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "That Quant Guy research project"}]
dependencies = []

[project.optional-dependencies]
shiller = ["xlrd>=2.0.1"]

[project.scripts]
presidential-data = "presidential_data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
