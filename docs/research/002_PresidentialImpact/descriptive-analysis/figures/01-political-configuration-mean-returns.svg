<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Mean annual return by political configuration and public market reconstruction</title>
  <desc id="desc">Side-by-side arithmetic mean nominal calendar-year returns for six political configurations, from 87 annual windows spanning 1936 through 2022. Green is the public CRSP-market-proxy baseline and blue is the Shiller S and P Composite dividend-reinvestment-style robustness reconstruction. This is descriptive rather than causal.</desc>
  <rect width="1000" height="590" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#34414D">
    <text x="70" y="30" font-size="17" font-weight="700">Mean annual return by political configuration</text>
    <text x="70" y="51" font-size="12">1936–2022 common sample · nominal calendar-year returns · arithmetic means · political label at the prior 31 December</text>
    <rect x="682" y="31" width="13" height="13" fill="#168350"/><text x="702" y="42" font-size="11">CRSP-market proxy</text>
    <rect x="840" y="31" width="13" height="13" fill="#1769A6"/><text x="860" y="42" font-size="11">Shiller reconstruction</text>
    <g stroke="#D5DCE3" stroke-width="1">
      <line x1="75" x2="950" y1="410" y2="410"/><line x1="75" x2="950" y1="330" y2="330"/>
      <line x1="75" x2="950" y1="250" y2="250"/><line x1="75" x2="950" y1="170" y2="170"/>
      <line x1="75" x2="950" y1="90" y2="90"/>
    </g>
    <g font-size="11" text-anchor="end"><text x="66" y="414">0%</text><text x="66" y="334">5%</text><text x="66" y="254">10%</text><text x="66" y="174">15%</text><text x="66" y="94">20%</text></g>
    <g>
      <rect x="114" y="246.1" width="25" height="163.9" fill="#168350"/><rect x="143" y="249.7" width="25" height="160.3" fill="#1769A6"/>
      <rect x="254" y="190.6" width="25" height="219.4" fill="#168350"/><rect x="283" y="186.3" width="25" height="223.7" fill="#1769A6"/>
      <rect x="394" y="156.2" width="25" height="253.8" fill="#168350"/><rect x="423" y="152.3" width="25" height="257.7" fill="#1769A6"/>
      <rect x="534" y="249.3" width="25" height="160.7" fill="#168350"/><rect x="563" y="255.4" width="25" height="154.6" fill="#1769A6"/>
      <rect x="674" y="129.3" width="25" height="280.7" fill="#168350"/><rect x="703" y="114.4" width="25" height="295.6" fill="#1769A6"/>
      <rect x="814" y="158.8" width="25" height="251.2" fill="#168350"/><rect x="843" y="167.9" width="25" height="242.1" fill="#1769A6"/>
    </g>
    <g font-size="10" text-anchor="middle">
      <text x="126.5" y="238">10.2%</text><text x="155.5" y="242">10.0%</text>
      <text x="266.5" y="182">13.7%</text><text x="295.5" y="178">14.0%</text>
      <text x="406.5" y="148">15.9%</text><text x="435.5" y="144">16.1%</text>
      <text x="546.5" y="241">10.0%</text><text x="575.5" y="247">9.7%</text>
      <text x="686.5" y="121">17.5%</text><text x="715.5" y="106">18.5%</text>
      <text x="826.5" y="151">15.7%</text><text x="855.5" y="160">15.1%</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="141" y="436">D president</text><text x="141" y="451">D Congress</text><text x="141" y="468">n = 33 · 8 administrations</text>
      <text x="281" y="436">D president</text><text x="281" y="451">R Congress</text><text x="281" y="468">n = 10 · 3 administrations</text>
      <text x="421" y="436">D president</text><text x="421" y="451">Split Congress</text><text x="421" y="468">n = 4 · 1 administration</text>
      <text x="561" y="436">R president</text><text x="561" y="451">D Congress</text><text x="561" y="468">n = 22 · 6 administrations</text>
      <text x="701" y="436">R president</text><text x="701" y="451">R Congress</text><text x="701" y="468">n = 8 · 3 administrations</text>
      <text x="841" y="436">R president</text><text x="841" y="451">Split Congress</text><text x="841" y="468">n = 10 · 3 administrations</text>
    </g>
    <line x1="75" x2="950" y1="493" y2="493" stroke="#D5DCE3"/>
    <text x="75" y="518" font-size="11">Paired public reconstructions preserve the observed ordering of the six configuration means; that descriptive fact is not evidence of an effect, a forecast, or a reliable trade.</text>
    <text x="75" y="540" font-size="11">The report table supplies administration-cluster resampling ranges. A row is an annual window, not an independent presidential observation.</text>
    <text x="75" y="567" font-size="10">QuantMeridian PRES engine · window_start assignment · exact December endpoints · USER-SUPPLIED local source files</text>
  </g>
</svg>
