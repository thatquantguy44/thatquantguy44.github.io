<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
  <title id="title">Annual return windows that span a political-configuration change</title>
  <desc id="desc">A timeline from 1936 through 2022. Dots identify 24 of 87 annual windows in which the supplied political-control intervals change between the annual return window's start and end. The fixed displayed group label remains the political configuration at the prior December 31 decision date.</desc>
  <rect width="1000" height="370" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#34414D">
    <text x="70" y="32" font-size="17" font-weight="700">Annual windows that cross a political-configuration change</text>
    <text x="70" y="54" font-size="12">Return window: prior December month-end to current December month-end · group assignment: configuration at window start</text>
    <line x1="100" x2="920" y1="152" y2="152" stroke="#5C6B78" stroke-width="2"/>
    <line x1="100" x2="920" y1="232" y2="232" stroke="#D5DCE3" stroke-width="10"/>
    <text x="89" y="156" font-size="11" text-anchor="end">sample</text>
    <text x="89" y="236" font-size="11" text-anchor="end">mixed</text>
    <g stroke="#D5DCE3" stroke-width="1"><line x1="100" y1="140" x2="100" y2="250"/><line x1="233.5" y1="140" x2="233.5" y2="250"/><line x1="386.0" y1="140" x2="386.0" y2="250"/><line x1="538.6" y1="140" x2="538.6" y2="250"/><line x1="691.2" y1="140" x2="691.2" y2="250"/><line x1="843.7" y1="140" x2="843.7" y2="250"/><line x1="920" y1="140" x2="920" y2="250"/></g>
    <g fill="#1769A6">
      <circle cx="185.8" cy="232" r="6"/><circle cx="204.9" cy="232" r="6"/><circle cx="224.0" cy="232" r="6"/>
      <circle cx="262.1" cy="232" r="6"/><circle cx="281.2" cy="232" r="6"/><circle cx="338.4" cy="232" r="6"/>
      <circle cx="357.4" cy="232" r="6"/><circle cx="414.7" cy="232" r="6"/><circle cx="462.3" cy="232" r="6"/>
      <circle cx="490.9" cy="232" r="6"/><circle cx="529.1" cy="232" r="6"/><circle cx="586.3" cy="232" r="6"/>
      <circle cx="605.3" cy="232" r="6"/><circle cx="643.5" cy="232" r="6"/><circle cx="662.6" cy="232" r="6"/>
      <circle cx="719.8" cy="232" r="6"/><circle cx="738.8" cy="232" r="6"/><circle cx="777.0" cy="232" r="6"/>
      <circle cx="796.0" cy="232" r="6"/><circle cx="815.1" cy="232" r="6"/><circle cx="853.3" cy="232" r="6"/>
      <circle cx="872.3" cy="232" r="6"/><circle cx="891.4" cy="232" r="6"/><circle cx="910.5" cy="232" r="6"/>
    </g>
    <g font-size="11" text-anchor="middle"><text x="100" y="273">1936</text><text x="233.5" y="273">1950</text><text x="386" y="273">1966</text><text x="538.6" y="273">1982</text><text x="691.2" y="273">1998</text><text x="843.7" y="273">2014</text><text x="920" y="273">2022</text></g>
    <text x="100" y="307" font-size="12">24 of 87 windows (27.6%) are not a single political configuration for their entire measured year.</text>
    <text x="100" y="328" font-size="11">The fixed start-date convention prevents a post-return relabeling; it does not turn the annual windows into clean political exposures.</text>
    <text x="100" y="351" font-size="10">Control interval diagnostics from QuantMeridian PRES engine · end dates treated as exclusive · no political-control gap is imputed</text>
  </g>
</svg>
